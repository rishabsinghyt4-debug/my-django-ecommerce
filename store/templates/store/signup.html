<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Create Account</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #ffffff;
            font-family: Arial, sans-serif;
        }
        .auth-card {
            max-width: 350px;
            margin: 20px auto;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px 26px;
        }
        .amazon-btn {
            background: #ffd814;
            border-color: #fcd200;
            border-radius: 8px;
            color: #0f1111;
        }
        .amazon-btn:hover {
            background: #f7ca00;
            border-color: #f2c200;
        }
    </style>
</head>
<body>

<div class="text-center mt-4 mb-2">
    <a href="{% url 'product_list' %}" class="text-dark text-decoration-none fs-2 fw-bold">
        <i class="fa-solid fa-bag-shopping text-warning me-1"></i>My Shop
    </a>
</div>

<div class="auth-card shadow-sm">
    <h3 class="fw-normal mb-3 fs-4">Create account</h3>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-danger py-2 small" role="alert">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <div class="mb-2">
            <label class="form-label fw-bold small mb-1">Username</label>
            <input type="text" name="username" class="form-control form-control-sm" required autofocus>
        </div>

        <div class="mb-2">
            <label class="form-label fw-bold small mb-1">Email (optional)</label>
            <input type="email" name="email" class="form-control form-control-sm">
        </div>

        <div class="mb-2">
            <label class="form-label fw-bold small mb-1">Password</label>
            <input type="password" name="password" class="form-control form-control-sm" required placeholder="At least 6 characters">
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold small mb-1">Re-enter password</label>
            <input type="password" name="confirm_password" class="form-control form-control-sm" required>
        </div>

        <button type="submit" class="btn amazon-btn w-100 py-1 fw-normal text-dark shadow-xs mt-2">
            Verify & Create Account
        </button>
    </form>

    <hr class="my-3">

    <p class="small mb-0" style="font-size: 13px;">
        Already have an account? 
        <a href="{% url 'login' %}" class="text-decoration-none">Sign in <i class="fa-solid fa-caret-right small"></i></a>
    </p>
</div>

</body>
</html>
