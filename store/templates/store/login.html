<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Sign-In</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #ffffff;
            font-family: Arial, sans-serif;
        }
        .auth-card {
            max-width: 350px;
            margin: 20px auto;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px 26px;
        }
        .amazon-btn {
            background: #ffd814;
            border-color: #fcd200;
            border-radius: 8px;
            color: #0f1111;
        }
        .amazon-btn:hover {
            background: #f7ca00;
            border-color: #f2c200;
        }
        .create-acc-btn {
            background: #e7e9ec;
            border-color: #adb1b8 #a2a6ac #8d9096;
            border-radius: 8px;
            color: #0f1111;
        }
        .create-acc-btn:hover {
            background: #dcdfe3;
        }
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #767676;
            font-size: 12px;
            margin: 20px 0;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e7e7e7;
        }
        .divider span {
            padding: 0 10px;
        }
    </style>
</head>
<body>

<div class="text-center mt-4 mb-2">
    <a href="{% url 'product_list' %}" class="text-dark text-decoration-none fs-2 fw-bold">
        <i class="fa-solid fa-bag-shopping text-warning me-1"></i>My Shop
    </a>
</div>

<div class="auth-card shadow-sm">
    <h3 class="fw-normal mb-3 fs-4">Sign in</h3>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-danger py-2 small" role="alert">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label fw-bold small mb-1">Username</label>
            <input type="text" name="username" class="form-control form-control-sm" required autofocus>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold small mb-1">Password</label>
            <input type="password" name="password" class="form-control form-control-sm" required>
        </div>

        <button type="submit" class="btn amazon-btn w-100 py-1 fw-normal text-dark shadow-xs mt-2">
            Sign in
        </button>
    </form>

    <p class="small text-muted mt-3 mb-0" style="font-size: 12px;">
        By continuing, you agree to My Shop's Conditions of Use and Privacy Notice.
    </p>
</div>

<div class="text-center" style="max-width: 350px; margin: 0 auto;">
    <div class="divider">
        <span>New to My Shop?</span>
    </div>
    <a href="{% url 'signup' %}" class="btn create-acc-btn w-100 py-1 small text-dark">
        Create your My Shop account
    </a>
</div>

</body>
</html>
