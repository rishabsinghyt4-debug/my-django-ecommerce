<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ product.title }} | My Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #eaeded; font-family: Arial, sans-serif; }
        .navbar-amazon { background-color: #131921; }
        .btn-amazon { background-color: #FFD814; border-color: #FCD200; color: #0F1111; font-weight: 600; }
        .btn-amazon:hover { background-color: #F7CA00; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark navbar-amazon py-2 mb-4">
        <div class="container px-4">
            <a class="navbar-brand fw-bold fs-4 text-warning" href="{% url 'product_list' %}">
                <i class="fa-solid fa-bag-shopping me-2"></i>My Shop
            </a>
            <a href="{% url 'cart_detail' %}" class="btn btn-outline-warning text-white btn-sm">
                <i class="fa-solid fa-cart-shopping me-1"></i> Cart
            </a>
        </div>
    </nav>

    <div class="container my-5">
        <div class="card border-0 shadow-sm p-4 bg-white rounded-3">
            <div class="row g-4 align-items-center">
                <div class="col-md-5 text-center">
                    {% if product.image %}
                        <img src="{{ product.image.url }}" class="img-fluid rounded max-h-400" style="max-height: 350px; object-fit: contain;" alt="{{ product.title }}">
                    {% else %}
                        <div class="bg-light p-5 rounded"><i class="fa-regular fa-image display-1 text-muted"></i></div>
                    {% endif %}
                </div>
                <div class="col-md-7">
                    <span class="badge bg-secondary mb-2">{{ product.category.name }}</span>
                    <h2 class="fw-bold text-dark mb-2">{{ product.title }}</h2>
                    <h3 class="text-danger fw-bold mb-3">₹{{ product.price }}</h3>
                    <p class="text-muted leading-relaxed mb-4">{{ product.description }}</p>
                    <hr>
                    <a href="{% url 'add_to_cart' product.id %}" class="btn btn-amazon px-5 py-2 rounded-pill fs-5">
                        <i class="fa-solid fa-cart-plus me-2"></i>Add to Cart
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
