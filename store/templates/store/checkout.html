<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | My Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #eaeded; font-family: Arial, sans-serif; }
        .navbar-amazon { background-color: #131921; }
        .btn-amazon { background-color: #FFD814; border-color: #FCD200; color: #0F1111; font-weight: 600; }
        .btn-amazon:hover { background-color: #F7CA00; }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark navbar-amazon py-2 mb-4">
        <div class="container px-4">
            <a class="navbar-brand fw-bold fs-4 text-warning" href="{% url 'product_list' %}">
                <i class="fa-solid fa-bag-shopping me-2"></i>My Shop
            </a>
            <span class="text-white fs-5 fw-semibold">Checkout</span>
        </div>
    </nav>

    <div class="container my-4">
        <div class="row g-4">
            <!-- Shipping Form -->
            <div class="col-lg-7">
                <div class="card border-0 shadow-sm p-4 bg-white rounded-3">
                    <h4 class="fw-bold mb-3 border-bottom pb-2">1. Delivery Address</h4>
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label font-weight-bold">Full Name</label>
                            <input type="text" name="full_name" class="form-control" required placeholder="John Doe">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Phone Number</label>
                            <input type="text" name="phone" class="form-control" required placeholder="10-digit mobile number">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Address</label>
                            <textarea name="address" class="form-control" rows="3" required placeholder="Flat, House no., Area, Street, Sector, Village"></textarea>
                        </div>
                        <button type="submit" class="btn btn-amazon w-100 py-2 rounded-pill mt-3 fs-5">Place Your Order</button>
                    </form>
                </div>
            </div>

            <!-- Order Summary -->
            <div class="col-lg-5">
                <div class="card border-0 shadow-sm p-4 bg-white rounded-3">
                    <h5 class="fw-bold mb-3 border-bottom pb-2">Order Summary</h5>
                    {% for item in cart_items %}
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <div>
                                <h6 class="mb-0 text-truncate" style="max-width: 200px;">{{ item.product.title }}</h6>
                                <small class="text-muted">Qty: {{ item.quantity }}</small>
                            </div>
                            <span class="fw-semibold">₹{{ item.get_total_price }}</span>
                        </div>
                    {% endfor %}
                    <hr>
                    <div class="d-flex justify-content-between fs-5 fw-bold text-danger">
                        <span>Order Total:</span>
                        <span>₹{{ total_price }}</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
