<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Placed | My Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #eaeded; font-family: Arial, sans-serif; }
        .navbar-amazon { background-color: #131921; }
        .btn-amazon { background-color: #FFD814; border-color: #FCD200; color: #0F1111; font-weight: 600; }
        .btn-amazon:hover { background-color: #F7CA00; }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark navbar-amazon py-2 mb-4">
        <div class="container px-4">
            <a class="navbar-brand fw-bold fs-4 text-warning" href="{% url 'product_list' %}">
                <i class="fa-solid fa-bag-shopping me-2"></i>My Shop
            </a>
        </div>
    </nav>

    <div class="container my-5 text-center">
        <div class="card border-0 shadow-sm p-5 bg-white rounded-3 mx-auto" style="max-width: 600px;">
            <i class="fa-solid fa-circle-check text-success display-1 mb-3"></i>
            <h2 class="fw-bold text-dark">Order Placed Successfully!</h2>
            <p class="text-muted">Thank you for your purchase. Your order ID is <strong>#{{ order.id }}</strong>.</p>
            <hr>
            <p class="mb-1"><strong>Delivering to:</strong> {{ order.full_name }}</p>
            <p class="text-muted small mb-4">{{ order.address }}</p>
            <a href="{% url 'product_list' %}" class="btn btn-amazon px-4 py-2 rounded-pill">Continue Shopping</a>
        </div>
    </div>

</body>
</html>
